# nginx reverse proxy for local/dev use via `docker compose`. Puts the Flask app and the
# voice session WebSocket worker behind a single plain-HTTP origin/port, so the whole app
# is reachable through one forwarded port (e.g. a VS Code tunnel / port-forward), with no
# separate origin for the voice socket. TLS is not handled here -- terminate it upstream
# (e.g. the tunnel) if needed. See deploy/nginx.conf for the production TLS version.

limit_req_zone $binary_remote_addr zone=interviewer_api:10m rate=10r/s;

server {
    listen 80;

    client_max_body_size 64k;

    location /static/ {
        alias /app/app/static/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        limit_req zone=interviewer_api burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
    }

    # Voice session WebSocket (worker/voice_session.py), proxied on the same origin so the
    # browser's CSP connect-src 'self' covers it and no extra CORS/mixed-content exception
    # is needed.
    location /voice/ {
        proxy_pass http://voice-session:8765;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 65s;
    }
}
