# nginx reverse proxy for AI Interviewer. Adjust server_name and cert paths,
# then symlink into /etc/nginx/conf.d/ or sites-enabled/.

limit_req_zone $binary_remote_addr zone=interviewer_api:10m rate=10r/s;

server {
    listen 80;
    server_name interviewer.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name interviewer.example.com;

    ssl_certificate     /etc/letsencrypt/live/interviewer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interviewer.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 64k;

    location /static/ {
        alias /opt/ai-interviewer/app/static/;
        expires 7d;
        access_log off;
    }

    location /api/ {
        limit_req zone=interviewer_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params.conf;
    }

    # Voice session WebSocket (worker/voice_session.py), proxied on the same origin so the
    # browser's CSP connect-src 'self' covers it and no extra CORS/mixed-content exception
    # is needed.
    location /voice/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        include proxy_params.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params.conf;
    }
}
