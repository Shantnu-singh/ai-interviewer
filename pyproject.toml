[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Voice-based AI technical interviewer (Flask port of code100x/ai-interviewer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "azure-identity>=1.26.0",
    "flask==3.1.3",
    "flask-limiter==4.1.1",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "openai>=3.26.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "redis==8.1.0",
    "rq==2.12.0",
    "sqlalchemy==2.1.1",
    "websockets==17.1",
]

[project.optional-dependencies]
bedrock = [
    "boto3==1.43.105",
]

[dependency-groups]
dev = [
    "fakeredis==2.38.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
